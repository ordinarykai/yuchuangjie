name: Build Yuchuangjie macOS internal installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build manual-install DMG (no Apple notarization)
        env:
          MACOS_RELEASE_MODE: internal
          APP_RELEASE_VERSION: '1.0.10'
          TARGET_ARCH: ${{ matrix.architecture }}
        run: bash build-on-mac.command
      - name: Upload the DMG to the authorized backend
        env:
          ATAI_MACOS_UPLOAD_TOKEN: ${{ secrets.ATAI_MACOS_UPLOAD_TOKEN }}
        run: python upload-to-backend.py --architecture '${{ matrix.architecture }}' --version '1.0.10'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-registration-${{ matrix.architecture }}
          path: registration/*.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: yuchuangjie-macos-${{ matrix.architecture }}-internal
          path: |
            output/${{ matrix.architecture }}/*.dmg
            output/${{ matrix.architecture }}/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14
