name: Stage existing macOS installers for download

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the successful macOS 1.0.9 build
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44099479204
          path: installers
      - name: Store installers in a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view macos-1.0.9-internal --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create macos-1.0.9-internal --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title 'Yuchuangjie macOS 1.0.9 internal installers' \
              --notes 'Manual installation only. Ad-hoc app signature; no Apple notarization. Apple Silicon and Intel installers from successful build 44099479204.'
          fi
          mapfile -d '' files < <(find installers -type f \( -name '*.dmg' -o -name '*.dmg.sha256' \) -print0)
          test "${#files[@]}" -eq 4
          gh release upload macos-1.0.9-internal --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          gh release view macos-1.0.9-internal --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '{isDraft, assets: [.assets[] | {name,size}]}'
